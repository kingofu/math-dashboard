<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 教学与学术项目看板</title>
    <!-- Google Fonts Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #F8F9FA;
            --container-bg: rgba(255, 255, 255, 0.9);
            --card-bg: #FFFFFF;
            --surface-muted: #F4F4F5;
            --border-color: rgba(0, 0, 0, 0.07);
            --border-hover: rgba(0, 0, 0, 0.22);
            --text-color: #18181B;
            --text-muted: #71717A;
            --accent-color: #18181B;
            --accent-glow: rgba(0, 0, 0, 0.05);
            --tag-bg: rgba(24, 24, 27, 0.05);
            --tag-text: #27272A;
            --shadow: 0 4px 24px rgba(0, 0, 0, 0.04);
            --header-gradient: linear-gradient(135deg, #18181B 0%, #52525B 100%);
            --green-bg: #ECFDF5;
            --green-text: #047857;
            --green-border: #A7F3D0;
            --amber-bg: #FFFBEB;
            --amber-text: #B45309;
            --amber-border: #FDE68A;
            --blue-bg: #EFF6FF;
            --blue-text: #1D4ED8;
            --blue-border: #BFDBFE;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            transition: background-color 0.2s, border-color 0.2s, color 0.2s, box-shadow 0.2s;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            padding: 2rem 1rem;
            position: relative;
            overflow-x: hidden;
        }

        .container {
            max-width: 1240px;
            margin: 0 auto;
            background: var(--container-bg);
            border: 1px solid var(--border-color);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 24px;
            padding: 2.5rem;
            box-shadow: var(--shadow);
        }

        /* Header block */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 1.5rem;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .header-title h1 {
            font-size: 2rem;
            font-weight: 700;
            background: var(--header-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Mode Switcher */
        .view-switcher {
            display: inline-flex;
            background: var(--surface-muted);
            padding: 0.3rem;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            gap: 0.25rem;
        }

        .view-btn {
            border: none;
            background: transparent;
            color: var(--text-muted);
            padding: 0.5rem 1rem;
            border-radius: 9px;
            font-size: 0.88rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .view-btn.active {
            background: var(--card-bg);
            color: var(--text-color);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
        }

        /* Starter Pack Section (懒人必装榜) */
        .starter-section {
            margin-bottom: 2.8rem;
        }

        .starter-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.2rem;
            flex-wrap: wrap;
            gap: 0.8rem;
        }

        .starter-title-group {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .starter-title-group h2 {
            font-size: 1.35rem;
            font-weight: 700;
            color: var(--text-color);
        }

        .starter-badge {
            background: var(--text-color);
            color: #FFFFFF;
            font-size: 0.75rem;
            font-weight: 600;
            padding: 0.25rem 0.65rem;
            border-radius: 999px;
        }

        .starter-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 1.25rem;
        }

        .starter-card {
            background: var(--card-bg);
            border: 1.5px solid rgba(0, 0, 0, 0.09);
            border-radius: 18px;
            padding: 1.35rem;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
        }

        .starter-card:hover {
            transform: translateY(-3px);
            border-color: var(--text-color);
            box-shadow: 0 12px 24px rgba(0, 0, 0, 0.06);
        }

        .scenario-tag {
            font-size: 0.76rem;
            font-weight: 700;
            color: var(--text-muted);
            letter-spacing: 0.02em;
            margin-bottom: 0.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .ease-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.25rem;
            font-size: 0.72rem;
            font-weight: 600;
            padding: 0.18rem 0.55rem;
            border-radius: 6px;
        }

        .ease-copy {
            background: var(--green-bg);
            color: var(--green-text);
            border: 1px solid var(--green-border);
        }

        .ease-exe {
            background: var(--amber-bg);
            color: var(--amber-text);
            border: 1px solid var(--amber-border);
        }

        .ease-web {
            background: var(--blue-bg);
            color: var(--blue-text);
            border: 1px solid var(--blue-border);
        }

        .ease-adv {
            background: var(--surface-muted);
            color: var(--text-muted);
            border: 1px solid var(--border-color);
        }

        .starter-name-row {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            gap: 0.5rem;
            margin-bottom: 0.45rem;
        }

        .starter-name {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--text-color);
            line-height: 1.3;
        }

        .starter-stars {
            font-size: 0.78rem;
            font-weight: 600;
            color: #d97706;
            background: rgba(245, 158, 11, 0.1);
            padding: 0.15rem 0.45rem;
            border-radius: 6px;
            white-space: nowrap;
        }

        .starter-desc {
            font-size: 0.85rem;
            color: var(--text-muted);
            line-height: 1.5;
            margin-bottom: 0.9rem;
        }

        .howto-box {
            background: var(--surface-muted);
            border-radius: 10px;
            padding: 0.65rem 0.75rem;
            font-size: 0.78rem;
            color: var(--text-color);
            line-height: 1.45;
            margin-bottom: 1rem;
            border: 1px solid rgba(0, 0, 0, 0.04);
        }

        .howto-label {
            font-weight: 700;
            display: block;
            margin-bottom: 0.2rem;
            color: var(--text-color);
        }

        .starter-actions {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 0.75rem;
        }

        .btn-primary-action {
            flex: 1;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.35rem;
            background: var(--accent-color);
            color: #FFFFFF;
            border: none;
            text-decoration: none;
            padding: 0.55rem 0.75rem;
            border-radius: 10px;
            font-size: 0.82rem;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
        }

        .btn-primary-action:hover {
            opacity: 0.88;
        }

        .btn-secondary-link {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: var(--surface-muted);
            color: var(--text-muted);
            text-decoration: none;
            padding: 0.55rem 0.7rem;
            border-radius: 10px;
            font-size: 0.78rem;
            font-weight: 500;
            border: 1px solid var(--border-color);
            white-space: nowrap;
        }

        .btn-secondary-link:hover {
            color: var(--text-color);
            border-color: var(--border-hover);
        }

        /* Alternatives Fold */
        .alt-details {
            border-top: 1px dashed var(--border-color);
            padding-top: 0.6rem;
            font-size: 0.78rem;
        }

        .alt-details summary {
            color: var(--text-muted);
            cursor: pointer;
            font-weight: 500;
            list-style: none;
            display: flex;
            align-items: center;
            justify-content: space-between;
            user-select: none;
        }

        .alt-details summary::-webkit-details-marker {
            display: none;
        }

        .alt-details summary:hover {
            color: var(--text-color);
        }

        .alt-list {
            margin-top: 0.5rem;
            display: flex;
            flex-direction: column;
            gap: 0.35rem;
        }

        .alt-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--surface-muted);
            padding: 0.35rem 0.55rem;
            border-radius: 6px;
            text-decoration: none;
            color: var(--text-color);
            font-size: 0.76rem;
        }

        .alt-item:hover {
            background: rgba(24, 24, 27, 0.08);
        }

        .alt-item-stars {
            color: var(--text-muted);
            font-weight: 600;
        }

        /* Section Divider */
        .library-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.2rem;
            padding-top: 1.5rem;
            border-top: 1px solid var(--border-color);
            flex-wrap: wrap;
            gap: 1rem;
        }

        .library-header h2 {
            font-size: 1.25rem;
            font-weight: 700;
        }

        /* Quick Ease Filter Pills */
        .ease-filter-bar {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .ease-pill {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            padding: 0.4rem 0.85rem;
            border-radius: 999px;
            font-size: 0.82rem;
            font-weight: 500;
            cursor: pointer;
        }

        .ease-pill:hover {
            border-color: var(--border-hover);
            color: var(--text-color);
        }

        .ease-pill.active {
            background: var(--accent-color);
            color: #FFFFFF;
            border-color: var(--accent-color);
        }

        /* Main Layout */
        .main-layout {
            display: grid;
            grid-template-columns: 150px 1fr;
            gap: 2.2rem;
            align-items: start;
        }

        .sidebar {
            position: sticky;
            top: 6rem;
            max-height: calc(100vh - 8rem);
            overflow-y: auto;
            scrollbar-width: none;
        }
        .sidebar::-webkit-scrollbar {
            display: none;
        }

        .controls {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .search-sort-bar {
            position: sticky;
            top: 0;
            z-index: 100;
            background: var(--bg-color);
            display: flex;
            flex-direction: row;
            gap: 1rem;
            width: 100%;
            margin-bottom: 1.5rem;
            padding: 0.8rem 0;
        }

        .search-wrapper {
            position: relative;
            flex-grow: 1;
        }

        .search-input {
            width: 100%;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 0.6rem 1rem 0.6rem 2.4rem;
            border-radius: 12px;
            font-size: 0.9rem;
            outline: none;
        }

        .search-input:focus {
            border-color: var(--accent-color);
            box-shadow: 0 0 12px var(--accent-glow);
        }

        .search-icon {
            position: absolute;
            left: 0.9rem;
            top: 50%;
            transform: translateY(-50%);
            fill: var(--text-muted);
            width: 1.1rem;
            height: 1.1rem;
            pointer-events: none;
        }

        .sort-select {
            width: auto;
            min-width: 160px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 0.6rem 1rem;
            border-radius: 12px;
            font-size: 0.88rem;
            outline: none;
            cursor: pointer;
        }

        /* Category Tabs */
        .tabs-container {
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
        }

        .tab {
            background: transparent;
            border: 1px solid transparent;
            color: var(--text-muted);
            padding: 0.5rem 0.65rem;
            border-radius: 8px;
            font-size: 0.82rem;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: flex-start;
            gap: 0.5rem;
            width: 100%;
            text-align: left;
        }

        .tab:hover {
            background: var(--tag-bg);
            color: var(--text-color);
        }

        .tab.active {
            background: var(--accent-color);
            color: #ffffff;
            border-color: var(--accent-color);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.12);
        }

        .tab-emoji {
            font-size: 1.05rem;
        }

        .tab-count {
            margin-left: auto;
            font-size: 0.72rem;
            opacity: 0.7;
        }

        /* Main Grid cards layout */
        .grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1.25rem;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 18px;
            padding: 1.4rem;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            overflow: hidden;
            animation: fadeIn 0.3s ease-out forwards;
        }

        .card:hover {
            transform: translateY(-3px);
            border-color: var(--border-hover);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.05);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.75rem;
            gap: 0.5rem;
        }

        .card-header-left {
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .card-num {
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text-muted);
            background: var(--tag-bg);
            padding: 0.2rem 0.5rem;
            border-radius: 6px;
        }

        .card-stars {
            display: flex;
            align-items: center;
            gap: 0.2rem;
            font-size: 0.82rem;
            font-weight: 600;
            color: #d97706;
            background: rgba(245, 158, 11, 0.1);
            padding: 0.2rem 0.55rem;
            border-radius: 6px;
        }

        .card-title {
            font-size: 1.12rem;
            font-weight: 600;
            line-height: 1.4;
            margin-bottom: 0.5rem;
            color: var(--text-color);
        }

        .card-desc {
            font-size: 0.88rem;
            color: var(--text-muted);
            line-height: 1.55;
            margin-bottom: 1rem;
            flex-grow: 1;
        }

        .card-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 0.35rem;
            margin-bottom: 1rem;
        }

        .card-tag {
            background: var(--tag-bg);
            color: var(--tag-text);
            font-size: 0.75rem;
            font-weight: 500;
            padding: 0.18rem 0.48rem;
            border-radius: 6px;
            cursor: pointer;
        }

        .card-tag:hover {
            background: var(--accent-color);
            color: #ffffff;
        }

        .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid var(--border-color);
            padding-top: 0.9rem;
            margin-top: auto;
        }

        .card-cat {
            font-size: 0.78rem;
            color: var(--text-muted);
            font-weight: 500;
        }

        .card-link {
            display: flex;
            align-items: center;
            gap: 0.35rem;
            background: var(--accent-color);
            color: #ffffff;
            text-decoration: none;
            padding: 0.42rem 0.85rem;
            border-radius: 9px;
            font-size: 0.82rem;
            font-weight: 600;
        }

        .card-link:hover {
            opacity: 0.88;
        }

        .card-link.disabled {
            background: var(--border-color);
            color: var(--text-muted);
            cursor: not-allowed;
            pointer-events: none;
        }

        .btn-outline {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            cursor: pointer;
            padding: 0.5rem 1.1rem;
            border-radius: 10px;
            font-size: 0.84rem;
            font-weight: 500;
        }

        .btn-outline:hover {
            border-color: var(--accent-color);
            color: var(--accent-color);
        }

        .empty-state {
            display: none;
            text-align: center;
            padding: 4rem 2rem;
            color: var(--text-muted);
        }

        .empty-state svg {
            width: 3.5rem;
            height: 3.5rem;
            fill: var(--border-color);
            margin-bottom: 0.8rem;
        }

        .empty-state h3 {
            font-size: 1.2rem;
            color: var(--text-color);
            margin-bottom: 0.5rem;
        }

        /* Responsive adaptations */
        @media (max-width: 1200px) {
            .starter-grid {
                grid-template-columns: repeat(2, 1fr);
            }
            .grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 992px) {
            .main-layout {
                grid-template-columns: 1fr;
                gap: 1.2rem;
            }
            .sidebar {
                position: static;
                width: 100%;
            }
            .search-sort-bar {
                position: static;
                padding: 0;
                margin-bottom: 1.2rem;
                background: transparent;
            }
            .tabs-container {
                flex-direction: row;
                flex-wrap: nowrap;
                overflow-x: auto;
                padding-bottom: 0.6rem;
                border-bottom: 1px solid var(--border-color);
                scrollbar-width: none;
            }
            .tabs-container::-webkit-scrollbar {
                display: none;
            }
            .tab {
                width: auto;
                white-space: nowrap;
                border-radius: 20px;
                padding: 0.5rem 1rem;
            }
        }

        @media (max-width: 768px) {
            .container { padding: 1.25rem; }
            .starter-grid { grid-template-columns: 1fr; }
            .search-sort-bar { flex-direction: column; }
            .sort-select { width: 100%; }
            .grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="header-title">
                <h1>AI数学教学与学术工具导航</h1>
            </div>
            <div class="view-switcher">
                <button class="view-btn active" id="btnShowAllView" onclick="switchMainView('hybrid')">⚡ 懒人精选 + 全部</button>
                <button class="view-btn" id="btnShowStarterOnly" onclick="switchMainView('starter')">🌟 仅看必装 8 件套</button>
            </div>
        </header>

        <!-- 顶部：懒人必装 8 大场景唯一首选 -->
        <section class="starter-section" id="starterSection">
            <div class="starter-header">
                <div class="starter-title-group">
                    <h2>⚡ 懒人必装 · 8大高频场景唯一首选</h2>
                    <span class="starter-badge">免配环境 · 万人验证</span>
                </div>
            </div>
            <div class="starter-grid" id="starterGrid">
                <!-- Javascript renders 8 champion cards here -->
            </div>
        </section>

        <!-- 下方：完整项目武器库 -->
        <section id="fullLibrarySection">
            <div class="library-header">
                <h2>📚 全部工具库（按痛点与门槛检索）</h2>
                <div class="ease-filter-bar">
                    <button class="ease-pill active" onclick="setEaseFilter('all', this)">全部项目</button>
                    <button class="ease-pill" onclick="setEaseFilter('easy', this)">🟢 零门槛（网页/安装包/提示词）</button>
                    <button class="ease-pill" onclick="setEaseFilter('advanced', this)">🟣 进阶插件（Skill / MCP / 命令行）</button>
                </div>
            </div>

            <div class="main-layout">
                <aside class="sidebar">
                    <section class="controls">
                        <div class="tabs-container" id="tabsContainer"></div>
                    </section>
                </aside>

                <div class="content-area">
                    <div class="search-sort-bar">
                        <div class="search-wrapper">
                            <svg class="search-icon" viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
                            <input type="text" class="search-input" placeholder="输入需求，例如：截图识公式、降重、翻译、PPT、数模..." id="searchInput" oninput="filterProjects()">
                        </div>
                        <select class="sort-select" id="sortSelect" onchange="filterProjects()">
                            <option value="stars_desc" selected>Star 降序（最热门）</option>
                            <option value="id_asc">序号升序</option>
                            <option value="id_desc">序号降序</option>
                        </select>
                    </div>

                    <main class="grid" id="projectsGrid"></main>

                    <div class="empty-state" id="emptyState">
                        <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
                        <h3>无匹配项目</h3>
                        <button class="btn-outline" style="margin-top: 1rem;" onclick="clearFilters()">重置筛选</button>
                    </div>
                </div>
            </div>
        </section>
    </div>

        // 判断普通项目是否属于“零门槛”
        function getProjectEaseMeta(p) {
            const text = `${p.name} ${p.description} ${p.url}`.toLowerCase();
            if (text.includes('提示词') || text.includes('prompt') || text.includes('humanizer') || text.includes('stop-slop') || text.includes('talk-normal') || text.includes('模板') || text.includes('template')) {
                return { type: 'easy', label: '🟢 复制/模板直用', cls: 'ease-copy' };
            }
            if (text.includes('umi-ocr') || text.includes('pdfpatcher') || text.includes('桌面') || text.includes('客户端') || text.includes('离线') || text.includes('aionui') || text.includes('cc-switch') || text.includes('webui') || text.includes('客户端')) {
                return { type: 'easy', label: '🟡 桌面软件', cls: 'ease-exe' };
            }
            if (text.includes('textbook') || text.includes('pumpkin-book') || text.includes('教程') || text.includes('指南') || text.includes('题库') || text.includes('真题') || text.includes('优秀论文') || text.includes('html') || p.category_id === 'other') {
                return { type: 'easy', label: '🔵 在线/资料直读', cls: 'ease-web' };
            }
            return { type: 'advanced', label: '🟣 进阶插件/Skill', cls: 'ease-adv' };
        }

        window.onload = function() {
            renderStarterGrid();
            renderTabs();
            document.getElementById('sortSelect').value = 'stars_desc';
            filterProjects();

        function switchMainView(mode) {
            const fullSec = document.getElementById('fullLibrarySection');
            const btnAll = document.getElementById('btnShowAllView');
            const btnStarter = document.getElementById('btnShowStarterOnly');
            if (mode === 'starter') {
                fullSec.style.display = 'none';
                btnAll.classList.remove('active');
                btnStarter.classList.add('active');
            } else {
                fullSec.style.display = 'block';
                btnAll.classList.add('active');
                btnStarter.classList.remove('active');
            }
        }

        function renderStarterGrid() {
            const grid = document.getElementById('starterGrid');
            grid.innerHTML = STARTER_CHAMPS.map((item, idx) => {
                const easeCls = item.easeType === 'copy' ? 'ease-copy' : (item.easeType === 'exe' ? 'ease-exe' : 'ease-web');
                const primaryBtn = item.primaryActionType === 'copy'
                    ? `<button class="btn-primary-action" onclick="copyStarterPrompt(${idx}, this)">${item.primaryLabel}</button>`
                    : `<a href="${item.primaryUrl}" target="_blank" class="btn-primary-action">${item.primaryLabel}</a>`;
                const secLabel = item.secondaryLabel || "源码页";

                const altsHtml = item.alts.map(a => `
                    <a href="${a.url}" target="_blank" class="alt-item">
                        <span>${a.name}</span>
                        <span class="alt-item-stars">⭐ ${a.stars} ↗</span>
                    </a>
                `).join('');

                return `
                    <div class="starter-card">
                        <div>
                            <div class="scenario-tag">
                                <span>${item.scenario}</span>
                                <span class="ease-badge ${easeCls}">${item.easeLabel}</span>
                            </div>
                            <div class="starter-name-row">
                                <h3 class="starter-name">${item.name}</h3>
                                <span class="starter-stars">⭐ ${item.stars}</span>
                            </div>
                            <p class="starter-desc">${item.desc}</p>
                            <div class="howto-box">

            }).join('');

        function copyStarterPrompt(idx, btnEl) {
            const text = STARTER_CHAMPS[idx].promptText;
            navigator.clipboard.writeText(text).then(() => {
                const orig = btnEl.innerHTML;
                btnEl.innerHTML = "✅ 已复制！直接去粘贴给 AI";
                btnEl.style.background = "#047857";
                setTimeout(() => {
                    btnEl.innerHTML = orig;
                    btnEl.style.background = "";
                }, 2200);
            });
        }

        function setEaseFilter(easeVal, btnEl) {
            activeEase = easeVal;
            document.querySelectorAll('.ease-pill').forEach(el => el.classList.remove('active'));
            btnEl.classList.add('active');
            filterProjects();
        }

        function parseStarValue(starStr) {
            if (!starStr || starStr === 'N/A' || starStr === '-') return -1;
            let val = parseFloat(starStr);
            if (isNaN(val)) return -1;
            if (starStr.toLowerCase().includes('k')) val *= 1000;
            return val;
        }

        function getShortCategory(catId, fullName) {
            const categoryMeta = {

                'literature_retrieval': { short: '查文献读论文', emoji: '🔍' },
                'paper_writing': { short: '写论文降重', emoji: '✍️' },
                'math_modeling': { short: '数学建模比赛', emoji: '🧮' },
                'doc_conversion': { short: 'PDF转Word/公式', emoji: '📄' },
                'formatting': { short: '自动排版模板', emoji: '📐' },

            return categoryMeta[catId] || { short: (fullName || "").substring(0, 5), emoji: '🔧' };

        function renderTabs() {
            const container = document.getElementById("tabsContainer");
            const allMeta = getShortCategory('all');
            let html = `<button class="tab active" onclick="selectCategory('all')" id="tab-all">
                <span class="tab-emoji">${allMeta.emoji}</span>
                <span class="tab-text">${allMeta.short}</span>
                <span class="tab-count">${PROJECTS.length}</span>
            </button>`;
            
            CATEGORIES.forEach(cat => {
                const count = PROJECTS.filter(p => p.category_id === cat.id).length;
                const meta = getShortCategory(cat.id, cat.name);
                html += `<button class="tab" onclick="selectCategory('${cat.id}')" id="tab-${cat.id}">
                    <span class="tab-emoji">${meta.emoji}</span>
                    <span class="tab-text">${meta.short}</span>
                    <span class="tab-count">${count}</span>
                </button>`;
            });
            
            container.innerHTML = html;
        }

        function selectCategory(catId) {
            activeCategory = catId;
            document.querySelectorAll(".tab").forEach(tab => tab.classList.remove("active"));
            document.getElementById(`tab-${catId}`).classList.add("active");
            filterProjects();
        }

        function clearFilters() {
            document.getElementById("searchInput").value = "";
            activeEase = "all";
            document.querySelectorAll('.ease-pill').forEach((el, i) => el.classList.toggle('active', i === 0));
            selectCategory('all');
        }

        function clickTag(tagName) {
            const searchInput = document.getElementById("searchInput");
            searchInput.value = tagName;
            filterProjects();
        }

        function filterProjects() {
            const query = document.getElementById("searchInput").value.trim().toLowerCase();
            const sortVal = document.getElementById("sortSelect").value;
            const grid = document.getElementById("projectsGrid");
            const emptyState = document.getElementById("emptyState");
            
            let filtered = PROJECTS.filter(p => {
                if (activeCategory !== 'all' && p.category_id !== activeCategory) return false;
                if (activeEase !== 'all') {
                    const ease = getProjectEaseMeta(p);
                    if (ease.type !== activeEase) return false;
                }
                if (query) {
                    const matchName = p.name.toLowerCase().includes(query);
                    const matchDesc = p.description.toLowerCase().includes(query);
                    const matchUrl = p.url.toLowerCase().includes(query);
                    const matchTags = p.tags.some(t => t.toLowerCase().includes(query));
                    return matchName || matchDesc || matchUrl || matchTags;
                }
                return true;
            });
            
            if (sortVal === "id_asc") {
                filtered.sort((a, b) => a.num - b.num);
            } else if (sortVal === "id_desc") {
                filtered.sort((a, b) => b.num - a.num);
            } else if (sortVal === "stars_desc") {
                filtered.sort((a, b) => parseStarValue(b.stars) - parseStarValue(a.stars));
            }
            
            if (filtered.length === 0) {
                grid.style.display = "none";
                emptyState.style.display = "block";
            } else {
                grid.style.display = "grid";
                emptyState.style.display = "none";
                
                grid.innerHTML = filtered.map(p => {
                    const starsHTML = p.stars && p.stars !== 'N/A' 
                        ? `<div class="card-stars">⭐ ${p.stars}</div>` 
                        : '';
                    const ease = getProjectEaseMeta(p);
                    const tagsHTML = p.tags.map(t => `<span class="card-tag" onclick="clickTag('${t}')">${t}</span>`).join('');
                    
                    const linkClass = p.url === 'N/A' ? 'card-link disabled' : 'card-link';
                    const linkText = p.url.includes('github.com') ? '查看项目' : (p.url === 'N/A' ? '无链接' : '打开网页');
                    
                    return `
                        <div class="card">
                            <div>
                                <div class="card-header">
                                    <div class="card-header-left">
                                        <span class="card-num">#${p.num}</span>
                                        <span class="ease-badge ${ease.cls}">${ease.label}</span>
                                    </div>
                                    ${starsHTML}
                                </div>
                                <h3 class="card-title">${p.name}</h3>
                                <p class="card-desc">${p.description}</p>
                                <div class="card-tags">
                                    ${tagsHTML}
                                </div>
                            </div>
                            <div class="card-footer">
                                <span class="card-cat">${p.category_name}</span>
                                <a href="${p.url}" class="${linkClass}" target="_blank">
                                    <svg style="width: 0.95rem; height: 0.95rem; fill: currentColor;" viewBox="0 0 24 24"><path d="M19 19H5V5h7V3H5c-1.11 0-2 .9-2 2v14c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2v-7h-2v7zM14 3v2h3.59l-9.83 9.83 1.41 1.41L19 6.41V10h2V3h-7z"/></svg>

                                </a>
                            </div>
                        </div>
